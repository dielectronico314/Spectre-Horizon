name: Validate SigMF Contract

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: Set up Python 3.10
      uses: actions/setup-python@v4
      with:
        python-version: "3.10"
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt pytest numpy httpx
    - name: Start Docker Environment for Tests
      run: |
        docker run -d --name harogic_final --net host -v ${{ github.workspace }}:/workspace penthertz/rfswift_noble:sdr_full sleep infinity
    - name: Run Tests
      run: |
        pytest tests/
