name: Validate SigMF Contract

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: Start Docker Environment for Tests
      run: |
        docker run -d --name harogic_final --net host -v ${{ github.workspace }}:/workspace penthertz/rfswift_noble:sdr_full sleep infinity
    - name: Run Tests inside Docker (mismo entorno validado los 20 días)
      run: |
        docker exec harogic_final pip install -r requirements.txt pytest 2>/dev/null || true
        docker exec -d harogic_final bash -c "/workspace/scripts/start_services.sh > /workspace/services.log 2>&1"
        sleep 2
        if ! docker exec harogic_final curl -sf http://localhost:8000/api/v1/health > /dev/null; then
          echo "⚠ Algo falló — revisa: docker exec harogic_final cat /workspace/services.log"
          exit 1
        fi
        docker exec harogic_final python3 -m pytest /workspace/tests/ -v -p no:libtmux
