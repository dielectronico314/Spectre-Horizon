<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Cenital RF Dashboard{% endblock %}</title>
    <link rel="stylesheet" href="/dashboard/static/style.css?v=8">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
    <header>
        <span>Cenital RF Spectrum</span>
        <nav>
            <a href="/dashboard/" {% if section == 'estado' %}class="active"{% endif %}>Estado</a>
            <a href="/dashboard/eventos" {% if section == 'eventos' %}class="active"{% endif %}>Eventos</a>
            <a href="/dashboard/sesiones" {% if section == 'sesiones' %}class="active"{% endif %}>Sesiones</a>
        </nav>
    </header>
    <main>
        {% block content %}{% endblock %}
    </main>
    <footer>
        <p>Dashboard mínimo — Día 17. Datos vía API REST del Día 16.</p>
    </footer>

    <script src="/dashboard/static/background.js?v=9" defer></script>
</body>
</html>
